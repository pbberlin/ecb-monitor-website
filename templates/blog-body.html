
<style>

    /* {{ curLg }} */

    :root:not([data-theme="dark"]) {
        --primary:       #C8D400;
    }        


    .blog-body {
        width:     clamp(40ch, 80vw, 75ch);
        margin-inline: auto;
        padding: 1rem;
        margin-bottom: 2.5rem;
    }

    
    .blog-body ul {
        position:      relative;
    }
    .blog-body ul::before {
        /* the vertical yellow   */
        content: "";
        position: absolute;
        z-index: -10;
        top:      1.95rem;
        bottom:   0.75rem;
        left:     0.90rem;
        
        width:  2px;
        background: var(--primary);
    }


    .blog-body h3 {
        margin-bottom: 1rem;
    }

    
    .blog-body li {
        position:      relative;
        margin-bottom: 0.3rem;
        margin-left:   0.3rem;
        padding-left:  2.2rem;
        list-style-type: disc;
        line-height:   1.25rem;
        list-style-position: inherit;
    }
    .blog-body li::before {
        /* artificial bullet */
        content: "";
        position: absolute;
        left:      6px;     /*  horiz. alignment with yellow line */
        top:      1.70rem;
        width:    1ch;
        height:   1ch;
        border-radius: 50%;
        background: var(--primary);
        box-shadow: 0 0 0 4px color-mix(in oklab, var(--primary), transparent 75%);
    }




    .blog-body li .date-line {
        font-size:   80%;
        font-weight: normal;
        /* color: red !important; */
        position: relative;
        top: 0.05rem;
    }
    .blog-body li p {
        margin-bottom: -0.35rem;
        font-size: 90%;
        font-weight: normal;
    }


    .blog-body li::marker {
        content: "";
    }







</style>

<div class="blog-body">

    {% if breadCrumb %}
        <p  style="font-size:90%; margin-bottom: 0.2rem;"> <a  autofocus href="/blog/{{blogType|safe}}">{{i18n.all_posts}}</a>   </p>
    {% endif %}

    {% if h1 %}
        <h3 style="margin-bottom: 0;" > {{h1}}</h3>
        <p  style="position: relative; top: -0.6rem;  margin: 0;font-size:80%;">{{dateLine}}</p>
    {% else %}
        <!-- <a href="/"  class="backspace-key" id="backspace-home"  tabindex="-1"  title="{{i18n.back_home_hint}}" > <img src="/static/img/symbols/back-home-2.png"  class="backspace-key"  alt="{{i18n.back_home_hint}}" > </a> -->
        {% if blogType=='policy' %}
            <h3> {{i18n.blog_policy_headline}} </h3>
        {% else %}
            <h3> {{i18n.headline_science_news}} </h3>
        {% endif %}
    {% endif %}

    {% if h2 %}
        <!-- <h4> {{h2}} </h4> -->
    {% endif %}


    {{ content | safe }}

</div>
